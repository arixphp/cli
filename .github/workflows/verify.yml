name: Verify

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify; empty uses the event checkout
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  tests:
    name: Pest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, xmlwriter, xmlreader, simplexml, fileinfo, iconv, curl, zip, phar
          ini-values: phar.readonly=0
          coverage: none
          tools: composer:v2

      - name: Locate Composer cache
        id: cache
        shell: bash
        run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.cache.outputs.path }}
          key: composer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('composer.lock') }}

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify PHP requirements
        run: composer check-platform-reqs

      - name: Prepare standalone core bundle
        run: php arix core:package

      - name: Run full suite
        run: php vendor/bin/pest

  style:
    name: Pint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php vendor/bin/pint --test
      - name: Check release-tool lock
        run: composer validate --strict --working-dir=.github/phpacker

  workflows:
    name: Actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color
